<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rasd — hors connexion</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,sans-serif;background:#f6f9fa;color:#14323b;text-align:center;padding:24px}
  img{width:72px;height:72px;border-radius:16px}
  h1{font-size:20px;margin:16px 0 6px}
  p{color:#52707a;max-width:34ch;margin:0 auto 18px;line-height:1.5}
  button{background:#0d5c73;color:#fff;border:0;border-radius:8px;padding:10px 18px;font-size:14px;cursor:pointer}
</style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="Rasd">
    <h1>Pas de connexion</h1>
    <p>Rasd lit toujours les données réglementaires en ligne. Reconnectez-vous puis réessayez.</p>
    <button onclick="location.reload()">Réessayer</button>
  </main>
</body>
</html>
