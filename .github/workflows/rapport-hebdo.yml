name: Veille Hebdomadaire ONSSA & Rapport PDF

on:
  schedule:
    # Chaque lundi à 06:00 UTC (07:00 heure de Rabat)
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rapport-hebdo:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install reportlab

      - name: Exécution de la veille ONSSA
        run: |
          python scripts/veille_onssa.py

      - name: Génération du rapport hebdomadaire PDF
        run: |
          python scripts/generer_pdf_hebdo.py

      - name: Envoi du rapport par email à abdouju30@gmail.com
        env:
          EMAIL_DESTINATAIRE: abdouju30@gmail.com
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          python scripts/envoyer_rapport_hebdo.py

      - name: Archivage du PDF en artefact GitHub
        uses: actions/upload-artifact@v4
        with:
          name: rapport-hebdo-onssa
          path: data/rapport-hebdo-onssa.pdf
          retention-days: 30

      - name: Commit et push des données actualisées
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/nouveautes.json data/rapport-hebdo-onssa.pdf
          git commit -m "chore(veille): actualisation hebdomadaire nouveautés ONSSA & PDF" || echo "Aucune modification"
          git push
