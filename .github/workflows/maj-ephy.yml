name: Veille — actualisation des registres

# ─────────────────────────────────────────────────────────────────────────────
# CE QUI SE RAFRAÎCHIT TOUT SEUL, ET CE QUI NE SE RAFRAÎCHIT PAS.
#
# Automatique, ici :
#   E-Phy (Anses)     republié chaque nuit de mardi à mercredi
#   APVMA (Australie) dump PUBCRIS, chaque semaine
#   AGROFIT (Brésil)  CSV ouvert du ministère — usines de synthèse
#   PSIS (Corée)      régénéré chaque jour, seul registre daté au jour
#   Sentinelle        recalculée derrière (elle croise Brésil × Corée × ONSSA)
#
# À la main, et c'est délibéré :
#   index ONSSA       Excel que vous maîtrisez           -> npm run import
#   textes ONSSA      avis / listes / décrets, le jeudi  -> workflow maj-onssa-regl
#   ICAMA (Chine)     ~200 POST sur un formulaire, ~7 min -> npm run import:icama
#   BKÜ (Turquie)     API DataTables, pas un dump         -> npm run import:bku
#   EPA (usines)      Qlik WebSocket, aucune M.A.         -> python scripts/import_epa.py
#   Catalogue russe   édition figée avril 2022            -> npm run import:russie
#
# Pourquoi passer par un commit plutôt que par une écriture à l'exécution :
#   • le système de fichiers est en lecture seule sur Vercel ;
#   • le commit déclenche un redéploiement, donc la mise en ligne est acquise ;
#   • surtout, l'historique git devient le JOURNAL DE LA VEILLE : chaque jour
#     où quelque chose bouge laisse une trace datée, lisible et opposable.
#
# La course tourne TOUS LES JOURS (07:00 Casablanca) mais ne commite QUE si un
# fichier a changé : une journée sans mouvement ne laisse aucune trace.
#
# GitHub n'exécute le cron QUE sur la branche par défaut (master). Un site
# déployé depuis une autre branche n'affichera pas ces données tant qu'elles
# n'y sont pas reprises. Le commit sur master est le journal de la veille.
#
# Prérequis : dépôt GitHub, GITHUB_TOKEN par défaut (contents: write).
# Le redéploiement Vercel depuis master n'est pas garanti (ignore-build) :
# reprendre les fichiers data/ sur la branche servie, ou `npm run maj`.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: "0 6 * * *" # tous les jours 06:00 UTC (07:00 à Casablanca)
  workflow_dispatch: # déclenchement manuel depuis l'onglet Actions

permissions:
  contents: write

concurrency:
  group: maj-veille
  cancel-in-progress: false

jobs:
  actualiser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # openpyxl lit l'export coréen ; E-Phy et APVMA n'ont besoin de rien.
      - name: Dépendances Python
        run: pip install --quiet openpyxl

      # Le pont vers les noms ISO (data/_iso.json) est régénéré par un script
      # TypeScript, pour n'avoir qu'UNE règle d'appariement dans tout l'outil.
      # Il n'est pas versionné : il faut donc Node ici.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Catalogue E-Phy — Anses
        run: python scripts/import_ephy.py | tee sortie-import.txt

      - name: Registre PUBCRIS — APVMA
        run: python scripts/import_apvma.py | tee -a sortie-import.txt

      # Même famille qu'APVMA : un CSV officiel, pas le site AGROFIT (403).
      # La sentinelle s'en sert ; un Brésil périmé rate les nouvelles usines.
      - name: Registre AGROFIT — Brésil
        id: agrofit
        continue-on-error: true
        run: python scripts/import_agrofit.py --frais | tee -a sortie-import.txt

      # Le seul registre daté au jour : c'est lui qui fait la veille des
      # nouveautés. Son échec ne doit pas emporter la veille réglementaire,
      # qui est l'essentiel — d'où le « continue-on-error ».
      - name: Registre PSIS — Corée du Sud
        id: psis
        continue-on-error: true
        run: python scripts/import_psis.py | tee -a sortie-import.txt

      - name: Sentinelle — matières et associations absentes du Maroc
        continue-on-error: true
        run: python scripts/sentinelle.py | tee -a sortie-import.txt

      - name: Y a-t-il eu un changement ?
        id: diff
        run: |
          SUIVIS="data/ephy.json data/apvma.json data/bresil.json data/coree.json data/sentinelle.json data/sentinelle-vu.json"
          if git diff --quiet -- $SUIVIS; then
            echo "change=non" >> "$GITHUB_OUTPUT"
            echo "Aucune évolution des registres — rien à commiter."
          else
            echo "change=oui" >> "$GITHUB_OUTPUT"
            python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib

          def lire(p):
              f = pathlib.Path(p)
              return json.loads(f.read_text(encoding="utf-8")) if f.exists() else {}

          lignes = []

          e = lire("data/ephy.json")
          if e:
              diff = e.get("diff", {})
              maj = e.get("meta", {}).get("majDonnees") or "date inconnue"
              n = diff.get("nbChangements", 0)
              lignes.append(f"E-Phy du {maj} — {n} changement(s) de statut")
              for c in diff.get("changements", [])[:15]:
                  lignes.append(f"  - {c['nom']} : {c.get('avant') or '—'} -> {c.get('apres') or '—'}")
              if n > 15:
                  lignes.append(f"  - … et {n - 15} autres")

          b = lire("data/bresil.json").get("meta", {})
          if b:
              lignes.append(
                  f"Brésil — {b.get('nbUsines')} usines, "
                  f"{b.get('nbMatieres')} M.A. index, relevé { (b.get('genere') or '')[:10] }"
              )

          k = lire("data/coree.json").get("meta", {})
          if k:
              lignes.append(
                  f"Corée — {k.get('nbHomologations')} homologations, "
                  f"{k.get('nbMelanges')} associations, dernière le {k.get('derniereHomologation')}"
              )

          s = lire("data/sentinelle.json").get("meta", {})
          if s:
              lignes.append(
                  f"Sentinelle — {s.get('nbCandidates')} candidates, "
                  f"{s.get('nbNouvelles')} nouvelle(s) depuis le dernier relevé"
              )

          print("resume<<EOF")
          print("\n".join(lignes) or "actualisation des métadonnées")
          print()
          print("Données E-Phy - Anses · APVMA PUBCRIS · AGROFIT (Brésil) · PSIS (RDA, Corée du Sud).")
          print("EOF")
          PY
          fi

      - name: Commiter la mise à jour
        if: steps.diff.outputs.change == 'oui'
        env:
          RESUME: ${{ steps.diff.outputs.resume }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ephy.json data/apvma.json data/bresil.json data/coree.json \
                  data/sentinelle.json data/sentinelle-vu.json
          git commit -m "Veille — actualisation des registres" -m "$RESUME"
          git push

      - name: Récapitulatif
        run: cat sortie-import.txt >> "$GITHUB_STEP_SUMMARY"
